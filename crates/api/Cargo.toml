[package]
name = "api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# NOTE: this crate is a pure HTTP *client* for the model providers — it does not
# serve, persist, or cache to an external store. It previously declared a server
# stack (axum/sqlx/redis/tower/tower-http/zstd/hmac/...) that no source file
# referenced; those were removed 2026-09-02 after a per-dependency audit
# confirmed zero uses across src/, tests/ and benches/. Keep this list minimal —
# every entry here is build time paid by every consumer.
[dependencies]
ctor = "0.2"
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# Internal crates
runtime = { path = "../runtime" }
telemetry = { path = "../telemetry" }

[dev-dependencies]
criterion.workspace = true
# Add runtime for test helpers
runtime = { path = "../runtime" }

[[bench]]
name = "prompt_cache_bench"
harness = false
